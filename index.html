<style>
  .title-card .post-text{ font-family:'Fraunces', serif; font-weight:500; font-size:1.06rem; line-height:1.45; color:var(--cream); margin:12px 0 0; }
  .title-card .meta a{ color:var(--steel); text-decoration:none; transition:color .15s; }
  .title-card .meta a:hover{ color:var(--gold); }
</style>
<script>
const esc = (str) =>
  String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
const truncate = (str, n) => {
  if (str.length <= n) return str;
  const cut = str.slice(0, n);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > 0 ? cut.slice(0, lastSpace) : cut) + '…';
};

// X sends post text with HTML entities (&amp; etc.) and a trailing t.co link.
// Decode the entities, drop the link, and tidy whitespace before display.
const decodeEntities = (str) =>
  String(str)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/&amp;/g, '&');
const cleanPost = (text) =>
  decodeEntities(text)
    .replace(/https?:\/\/t\.co\/\S+/gi, '')
    .replace(/\s+/g, ' ')
    .trim();

async function loadPosts() {
  try {
    const res = await fetch('data/posts.json', { cache: 'no-store' });
    if (!res.ok) return; // no data file yet — keep the placeholder content
    const data = await res.json();

    // Keep the hero numbers in step with the real account stats.
    const acct = data.account;
    if (acct) {
      const fmt = (n) =>
        n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
        : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'
        : String(n);
      const postsEl = document.getElementById('stat-posts');
      const followersEl = document.getElementById('stat-followers');
      if (postsEl && acct.posts) postsEl.textContent = fmt(acct.posts);
      if (followersEl && acct.followers) followersEl.textContent = fmt(acct.followers);
    }

    const tweets = data.tweets || [];
    if (!tweets.length) return;

    // Update the marquee ticker with real post text.
    const ticker = document.getElementById('ticker-track');
    if (ticker) {
      const items = tweets
        .map((t) => truncate(cleanPost(t.text), 120))
        .filter(Boolean)
        .map((text) => `<span>${esc(text.toUpperCase())}</span>`)
        .join('');
      ticker.innerHTML = items + items; // duplicated for a seamless scroll loop

      // Scroll speed should depend on content length, not a fixed duration —
      // otherwise longer real post text blurs past at the same fixed pace.
      const pixelsPerSecond = 60;
      const singleSetWidth = ticker.scrollWidth / 2; // half, since content is duplicated
      const duration = Math.max(20, singleSetWidth / pixelsPerSecond);
      ticker.style.animationDuration = `${duration}s`;
    }

    // Update the dispatch cards with your latest real posts.
    const grid = document.getElementById('dispatch-grid');
    if (grid) {
      grid.innerHTML = tweets
        .filter((t) => cleanPost(t.text))
        .slice(0, 6)
        .map((t) => {
          const date = new Date(t.created_at).toLocaleDateString(undefined, {
            month: 'short', day: 'numeric'
          });
          return `
            <div class="title-card">
              <span class="tag">FROM THE FEED</span>
              <p class="post-text">${esc(truncate(cleanPost(t.text), 240))}</p>
              <div class="meta"><a href="${t.url}" target="_blank" rel="noopener" aria-label="Open this post on X">${date} ↗</a><span>${t.likes} ${t.likes === 1 ? 'like' : 'likes'}</span></div>
              <div class="actions">
                <a href="https://twitter.com/intent/like?tweet_id=${t.id}" target="_blank" rel="noopener" aria-label="Like this post on X">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.3-8.1C.9 10.1 1.4 6.6 4.4 5.1c2.2-1.1 4.6-.3 5.9 1.4.5.6.9 1.3 1.7 1.3s1.2-.7 1.7-1.3c1.3-1.7 3.7-2.5 5.9-1.4 3 1.5 3.5 5 1.7 7.8C18.7 16.65 12 21 12 21z"/></svg>
                  Like
                </a>
                <a href="https://twitter.com/intent/tweet?in_reply_to=${t.id}" target="_blank" rel="noopener" aria-label="Reply to this post on X">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6.5c0-1.4-1.1-2.5-2.5-2.5h-13C4.1 4 3 5.1 3 6.5v8c0 1.4 1.1 2.5 2.5 2.5H7v3.3c0 .4.5.7.8.4L12 17h6.5c1.4 0 2.5-1.1 2.5-2.5v-8z"/></svg>
                  Reply
                </a>
                <a href="https://twitter.com/intent/retweet?tweet_id=${t.id}" target="_blank" rel="noopener" aria-label="Repost this on X">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 2l4 4-4 4V7h-7a3 3 0 0 0-3 3v2H5v-2a5 5 0 0 1 5-5h7V2zM7 22l-4-4 4-4v3h7a3 3 0 0 0 3-3v-2h2v2a5 5 0 0 1-5 5H7v3z"/></svg>
                  Repost
                </a>
              </div>
            </div>`;
        })
        .join('');
    }
  } catch (e) {
    // If anything goes wrong, the static placeholder content simply stays put.
    console.log('Live posts unavailable, showing placeholder content.', e);
  }
}

async function loadTrailers() {
  try {
    const res = await fetch('data/trailers.json', { cache: 'no-store' });
    if (!res.ok) return; // no data file yet — keep the placeholder slots
    const data = await res.json();
    const clips = data.clips || [];
    if (!clips.length) return;

    const grid = document.getElementById('screening-grid');
    if (!grid) return;

    grid.innerHTML = clips
      .map((c) => `
        <div class="screening-card">
          <div class="screening-thumb" data-video-id="${c.id}">
            <img src="${c.thumbnail}" alt="" loading="lazy">
            <div class="screening-play"><span>
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </span></div>
          </div>
          <div class="screening-body">
            <h3>${esc(truncate(c.title, 70))}</h3>
            <div class="meta">${esc(c.channel)}</div>
          </div>
        </div>`)
      .join('');

    grid.querySelectorAll('.screening-thumb').forEach((thumb) => {
      thumb.addEventListener('click', () => {
        const videoId = thumb.getAttribute('data-video-id');
        thumb.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      }, { once: true });
    });
  } catch (e) {
    // If anything goes wrong, the static placeholder slots simply stay put.
    console.log('Live trailers unavailable, showing placeholder slots.', e);
  }
}

loadPosts();
loadTrailers();
</script>
</body>
</html>
