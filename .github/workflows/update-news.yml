name: Update news from RSS

on:
  schedule:
    - cron: "20 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}       # adds a manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch headlines from RSS feeds
        run: node scripts/fetch-news.mjs

      - name: Commit updated news.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update news from RSS"
            git pull --rebase
            git push
          fi
