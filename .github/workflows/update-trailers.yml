name: Update trailers from YouTube

on:
  schedule:
    - cron: "0 6 * * *"    # runs once a day
  workflow_dispatch: {}     # adds a manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest trailers from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-trailers.mjs

      - name: Commit updated trailers.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trailers.json
          git diff --cached --quiet || git commit -m "Update trailers from YouTube"
          git push
