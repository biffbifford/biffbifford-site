<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Challenge | BiffBifford</title>
<meta name="description" content="Five classic film, TV and music questions, the same for everyone, once a day. Build a streak, earn badges, share your score.">
<meta property="og:type" content="website">
<meta property="og:title" content="The BiffBifford Daily Challenge">
<meta property="og:description" content="Five questions a day, the same for everyone. Keep your streak alive.">
<meta property="og:url" content="https://biffbifford.com/challenge.html">
<meta property="og:image" content="https://biffbifford.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://biffbifford.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#15120D;--soft:#1D1811;--cream:#EDE3CC;--gold:#C9A036;--gold-dim:#8A6F27;--rust:#8C3B2E;--rust-hi:#C4604D;--steel:#8F8878;--good:#7FBF8A;--line:rgba(237,227,204,.16)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#2a2116 0,var(--ink) 65%);color:var(--cream);font-family:"Work Sans",system-ui,sans-serif;line-height:1.55;min-height:100vh}
a{color:var(--gold)}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 56px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0}
.top a{color:var(--cream);text-decoration:none;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.1rem}
.top span{font-family:"Space Mono",monospace;font-size:.78rem;color:var(--steel)}
.banner{background:var(--rust);color:#fff;padding:8px 12px;border-radius:4px;font-size:.9rem;margin-bottom:14px}
h1{font-family:"Fraunces",Georgia,serif;font-size:clamp(2rem,6vw,3rem);line-height:1.08;margin:18px 0 8px}
.lead{color:var(--steel);margin:0 0 22px;max-width:34em}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 16px;min-width:110px}
.stat b{display:block;font-family:"Space Mono",monospace;font-size:1.6rem;color:var(--gold);line-height:1.1}
.stat span{font-size:.8rem;color:var(--steel)}
.panel{background:var(--soft);border:1px solid var(--line);border-top:4px solid var(--gold);padding:24px}
.hud{display:flex;justify-content:space-between;font-family:"Space Mono",monospace;font-size:.85rem;color:var(--gold);margin-bottom:6px}
.dots{display:flex;gap:8px;margin-bottom:18px}
.dots i{flex:1;height:8px;background:rgba(201,160,54,.18);border-radius:2px}
.dots i.on{background:var(--gold)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--rust-hi)}
.q{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(1.25rem,3.4vw,1.6rem);line-height:1.3;margin:0 0 20px}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;list-style:none;padding:0;margin:0}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;font:inherit;font-weight:500;color:var(--cream);background:rgba(237,227,204,.05);border:1px solid var(--gold-dim);border-radius:4px;padding:12px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(201,160,54,.14)}
.opt .k{font-family:"Space Mono",monospace;font-weight:700;color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:rgba(127,191,138,.18)}
.opt.wrong{border-color:var(--rust-hi);background:rgba(196,96,77,.22)}
.verdict{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.2rem;margin:16px 0 4px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--rust-hi)}
.btn{display:inline-flex;align-items:center;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);background:var(--gold);border:0;border-radius:4px;padding:12px 24px;min-height:46px;text-decoration:none}
.btn:hover{background:#dcb64a}
.btn.alt{background:transparent;color:var(--cream);border:1px solid var(--gold-dim)}
.btn.alt:hover{border-color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.score{font-family:"Space Mono",monospace;font-weight:700;font-size:3.4rem;line-height:1;color:var(--gold);margin:6px 0}
.grid{font-size:2rem;letter-spacing:.2rem;margin:6px 0 10px}
.small{color:var(--steel);font-size:.9rem}
h2{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;margin:34px 0 10px}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));list-style:none;padding:0;margin:0}
.badge{border:1px solid var(--line);background:var(--soft);padding:12px 14px;opacity:.5}
.badge.got{opacity:1;border-color:var(--gold-dim);border-left:4px solid var(--gold)}
.badge b{display:block;font-family:"Fraunces",Georgia,serif}
.badge span{font-size:.85rem;color:var(--steel)}
.fine{color:var(--steel);font-size:.85rem;margin-top:28px}
.new{color:var(--gold);font-weight:600;margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">BiffBifford</a><span>Daily Challenge</span></div>
<div id="banner"></div>
<h1>The Daily Challenge</h1>
<p class="lead">Five questions, the same for everyone, once a day. Keep your streak alive and collect badges.</p>
<div class="stats" id="stats"></div>
<div id="view"><p class="small">Loading today's questions…</p></div>
<h2>Badges</h2>
<ul class="badges" id="badges"></ul>
<p class="fine">Your streak and badges live in this browser. <a href="quiz.html">Full quiz</a> · <a href="arcade.html">Arcade</a> · <a href="wheel.html">Wheel</a></p>
</div>
<script>
(function(){
var preview=/[?&]preview=1/.test(location.search);
var KEY="bb_daily_v1",$=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var today=dstr(new Date()),yest=dstr(new Date(Date.now()-864e5));
// seeded rng so everyone gets the same set on the same date
function hash(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function rng(seed){var a=hash(seed)();return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var BADGES=[
 {id:"first",n:"Opening Night",d:"Finish your first Daily Challenge",f:function(s){return s.played>=1}},
 {id:"perfect",n:"Perfect Night",d:"Score 5 out of 5",f:function(s){return s.perfects>=1}},
 {id:"s3",n:"On a Roll",d:"3 days in a row",f:function(s){return s.best>=3}},
 {id:"s7",n:"Weekly Regular",d:"7 days in a row",f:function(s){return s.best>=7}},
 {id:"p10",n:"Regular at the Drive-In",d:"Play 10 days",f:function(s){return s.played>=10}},
 {id:"s30",n:"Hall of Fame",d:"30 days in a row",f:function(s){return s.best>=30}}
];
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||"{}");return o&&typeof o==="object"?o:{}}catch(e){return{}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
var S=load();
S.streak=S.streak||0;S.best=S.best||0;S.played=S.played||0;S.perfects=S.perfects||0;S.badges=S.badges||[];
function renderStats(){
 var live=(S.last===today||S.last===yest)?S.streak:0;
 $("stats").innerHTML='<div class="stat"><b>'+live+'</b><span>day streak</span></div><div class="stat"><b>'+S.best+'</b><span>best streak</span></div><div class="stat"><b>'+S.played+'</b><span>days played</span></div>';
 $("badges").innerHTML=BADGES.map(function(b){var g=S.badges.indexOf(b.id)>=0;return'<li class="badge'+(g?" got":"")+'"><b>'+(g?"★ ":"")+esc(b.n)+'</b><span>'+esc(b.d)+'</span></li>'}).join("");
}
function pickToday(all){
 var r=rng("bb-"+today),used={},out=[],targets=[2,3,5,6,8];
 targets.forEach(function(t){
  var c=all.filter(function(q){return !used[q.id]&&Math.abs(q.level-t)<=1});
  if(!c.length)c=all.filter(function(q){return !used[q.id]});
  c.sort(function(a,b){return a.id<b.id?-1:1});
  var q=c[Math.floor(r()*c.length)];used[q.id]=1;out.push(q);
 });
 return out;
}
function order(q,r){var idx=[0,1,2,3];for(var i=3;i>0;i--){var j=Math.floor(r()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t}return idx}
var Q=[],P,res,pos;
function dots(){return'<div class="dots">'+Q.map(function(_,i){return'<i class="'+(res[i]===1?"ok":res[i]===0?"no":i===pos?"on":"")+'"></i>'}).join("")+'</div>'}
function ask(){
 var q=Q[pos],r=rng("o-"+today+q.id),ord=order(q,r);
 var h='<div class="panel"><div class="hud"><span>Question '+(pos+1)+' of '+Q.length+'</span><span>'+esc(q.category)+'</span></div>'+dots()+'<p class="q">'+esc(q.q)+'</p><ul class="opts">';
 ord.forEach(function(oi,k){h+='<li><button class="opt" data-c="'+(oi===q.answer?1:0)+'"><span class="k">'+"ABCD"[k]+'</span><span>'+esc(q.options[oi])+'</span></button></li>'});
 $("view").innerHTML=h+'</ul><div id="after" aria-live="polite"></div></div>';
 var btns=document.querySelectorAll(".opt");
 btns.forEach(function(b){b.onclick=function(){
  var ok=b.dataset.c==="1";res[pos]=ok?1:0;
  btns.forEach(function(x){x.disabled=true;if(x.dataset.c==="1")x.classList.add("right")});
  if(!ok)b.classList.add("wrong");
  S.today={d:today,ids:Q.map(function(x){return x.id}),res:res};save(S);
  var last=pos===Q.length-1;
  $("after").innerHTML='<div class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</div><p>'+esc(q.fact)+'</p><button class="btn" id="nx">'+(last?"See my result":"Next question")+'</button>';
  $("nx").onclick=function(){if(last)finish();else{pos++;ask()}};
  $("nx").focus();
 }});
}
function grid(r){return r.map(function(x){return x===1?"🎬":"⬛"}).join("")}
function finish(){
 var score=res.reduce(function(a,b){return a+(b===1?1:0)},0),newb=[];
 if(S.last!==today){
  S.streak=(S.last===yest)?S.streak+1:1;S.last=today;S.played++;if(score===5)S.perfects++;
  S.best=Math.max(S.best,S.streak);
  BADGES.forEach(function(b){if(S.badges.indexOf(b.id)<0&&b.f(S)){S.badges.push(b.id);newb.push(b.n)}});
 }
 S.today={d:today,ids:Q.map(function(x){return x.id}),res:res,done:1};save(S);
 renderStats();showResult(score,newb);
}
function nextIn(){var n=new Date();var m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);var s=Math.floor((m-n)/1000);return Math.floor(s/3600)+"h "+pad(Math.floor(s%3600/60))+"m"}
function showResult(score,newb){
 var dt=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"});
 var txt="🎬 BiffBifford Daily Challenge, "+dt+"\n"+grid(res)+" "+score+"/5\n🔥 "+S.streak+"-day streak\n";
 var xurl="https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)+"&url="+encodeURIComponent("https://biffbifford.com/challenge.html");
 var msg=score===5?"A perfect night.":score>=3?"Nice work.":"Tomorrow's a new show.";
 $("view").innerHTML='<div class="panel"><div class="small">'+esc(dt)+'</div><div class="score">'+score+'/5</div><div class="grid" aria-label="'+score+' of 5 correct">'+grid(res)+'</div><p>'+msg+' You\'re on a <b>'+S.streak+'-day</b> streak.</p>'+(newb&&newb.length?'<p class="new">New badge: '+newb.map(esc).join(", ")+'</p>':'')+'<div class="row"><a class="btn" href="'+xurl+'" target="_blank" rel="noopener">Share to X</a><button class="btn alt" id="cp">Copy result</button></div><p class="small" style="margin-top:16px">Next challenge in '+nextIn()+'. Want more now? Try the <a href="arcade.html">Arcade</a> or spin the <a href="wheel.html">Wheel</a>.</p></div>';
 $("cp").onclick=function(){var b=$("cp");function ok(){b.textContent="Copied"}try{navigator.clipboard.writeText(txt+"https://biffbifford.com/challenge.html").then(ok,function(){b.textContent="Press and hold to copy"})}catch(e){b.textContent="Select and copy from X"}};
}
fetch("data/questions.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){
 var all=(d.questions||d).filter(function(q){return !q.final&&(preview||q.verified===true)});
 if(all.length<10)throw 0;
 renderStats();
 if(preview)$("banner").innerHTML='<div class="banner">Preview: unverified questions included.</div>';
 var t=S.today&&S.today.d===today?S.today:null,byId={};all.forEach(function(q){byId[q.id]=q});
 if(t&&t.ids.every(function(i){return byId[i]})){Q=t.ids.map(function(i){return byId[i]});res=t.res||[]}
 else{Q=pickToday(all);res=[];S.today=null}
 if(t&&t.done&&Q.length===res.length){var sc=res.reduce(function(a,b){return a+(b===1?1:0)},0);showResult(sc,[]);return}
 pos=0;while(pos<res.length&&res[pos]!==undefined&&res[pos]!==null)pos++;
 if(pos>=Q.length){finish();return}
 ask();
}).catch(function(){renderStats();$("view").innerHTML='<p class="small">Today\'s challenge isn\'t ready yet. Try the <a href="quiz.html">quiz</a> in the meantime.</p>'});
})();
</script>
</body>
</html>
